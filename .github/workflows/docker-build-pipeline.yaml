name: Docker-Build-Store

on:
  workflow_run:
    workflows:
      - Togo-Backend-lrf
    types:
      - completed

jobs:
  build-and-store:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Login into Azure Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and Push docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME_SERVICE_ONE }}:${{ github.sa }}
            ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME_SERVICE_ONE }}:${{ env.IMAGE_VERSION_ONE }}

    # Deploy to container app
      - name: Deploy to azure web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.IMAGE_NAME_SERVICE_ONE }}
          images: '${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME_SERVICE_ONE }}:${{ github.sha }}'

