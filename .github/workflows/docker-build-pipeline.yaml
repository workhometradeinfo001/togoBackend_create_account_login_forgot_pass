name: Docker-Build-Store

on:
  workflow_run:
    workflows:
      - Togo-Backend-lrf
    types:
      - completed

jobs:
  build-and-store:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Docker build
        run: docker build -t ${{ secrets.ACR_LOGIN_SERVER }}/${{ secrets.IMAGE_NAME }}:${{secrets.IMAGE_VERSION_ONE}} .

      - name: Login into Azure Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Push docker image
        run: |
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/${{ secrets.IMAGE_NAME }}:${{ secrets.IMAGE_VERSION_ONE }}

      - name: Login into azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Create Environment if didn't exits
        run: |
          if az containerapp env show --name togo-environment --resources-group ${{ secrets.ACR_RESOURCE_GROUP }} > /dev/null 2>&1; then
            echo "Environment exits, Skipping environment creation"
          else 
            echo "Environment doesn't exists, Creating..."
            az containerapp env create \
            --name togo-environment \
            --resource-group ${{ secrets.ACR_RESOURCE_GROUP }} \
            --location southeastasia
          fi

      - name: Deploy into container
        run: |
          az containerapp up \
          --name lrf-container \
          --resource-group ${{ secrets.ACR_RESOURCE_GROUP }} \
          --environment togo-environment \
          --location southeastasia \
          --image ${{ secrets.ACR_LOGIN_SERVER }}/${{ secrets.IMAGE_NAME }}:${{ secrets.IMAGE_VERSION_ONE }} \
          --registry-server ${{ secrets.ACR_LOGIN_SERVER }} \
          --registry-username ${{ secrets.ACR_USERNAME }} \
          --registry-password ${{ secrets.ACR_PASSWORD }} \
          --target-port 8081 \
          --ingress external \
          --env-vars \
            ODBURL="${{ secrets.ODBURL }}" \
            ODBUSERNAME="${{ secrets.ODBUSERNAME }}" \
            ODBPASSWORD="${{ secrets.ODBPASSWORD }}" \
            AMQPADDRESS="${{ secrets.AMQPADDRESS }}" \
            MAILFORSEND="${{ secrets.MAILFORSEND }}" \
            PASSMAILAPP="${{ secrets.PASSMAILAPP }}"

      - name: After Successull
        run: echo "Success"